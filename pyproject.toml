[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locsync"
version = "0.1.0"
description = "Android strings.xml ⇄ Google Sheet localization sync"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.120",
  "google-auth>=2.29",
  "lxml>=5.2",
]

[tool.setuptools.packages.find]
include = ["locsync*"]
exclude = ["tests*", "app*"]
