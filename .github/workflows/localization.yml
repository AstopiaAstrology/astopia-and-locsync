name: localization

on:
  pull_request:
    paths:
      - "app/src/main/res/values/strings.xml"
      - "locsync.config.json"
  push:
    branches: [main]
    paths:
      - "app/src/main/res/values/strings.xml"
      - "locsync.config.json"
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC pull+validate
  workflow_dispatch:

jobs:
  push:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Push source keys to Sheet
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python -m locsync push

  pull_and_validate:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Pull translations from Sheet
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python -m locsync pull
      - name: Validate
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python -m locsync validate
      - name: Commit regenerated translations
        run: |
          if [[ -n "$(git status --porcelain app/src/main/res)" ]]; then
            git config user.name  "locsync-bot"
            git config user.email "locsync-bot@users.noreply.github.com"
            git checkout -b locsync/update-$(date +%Y%m%d-%H%M%S)
            git add app/src/main/res
            git commit -m "chore(i18n): sync translations from Sheet"
            git push -u origin HEAD
            gh pr create --fill --title "chore(i18n): sync translations from Sheet" || true
          else
            echo "No translation changes."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
